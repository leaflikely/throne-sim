<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dice Throne</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#06090F;color:#9AABBC;font-family:'Segoe UI',system-ui,sans-serif;user-select:none;overflow:hidden}
button{font-family:inherit;cursor:pointer}
:root{
  --teal:#00C4A0;--gold:#B07C18;
  --hp:#A82828;--txt:#9AABBC;--txtb:#CDD8E4;--txtd:#3E4E5E;
  --surf:#0C1220;--panel:#0F1828;--bdr:#1C2538;--bdrhi:#283248;
}

/* ── Layout ── */
:root{--panel-w:583px}
#app{position:relative;width:100vw;height:100vh;overflow:hidden}
#hdr{position:absolute;top:0;left:0;right:var(--panel-w);height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--bdr);background:#06090F;z-index:10}
/* center-block: pinned between both hand strips */
#center-block{position:absolute;top:calc(46px + var(--hand-h));left:0;right:var(--panel-w);bottom:calc(var(--hand-h) + 6px);display:flex;flex-direction:column;overflow:hidden}
#p2sec{flex:1;overflow:hidden;border-bottom:1px solid var(--bdr);min-height:0;position:relative;z-index:1}
#p1sec{flex:1;overflow:hidden;border-top:1px solid var(--bdr);min-height:0;position:relative;z-index:1}
#midsec{flex:0 0 auto;display:flex;flex-direction:column;border-bottom:1px solid var(--bdr);position:relative;z-index:1}
#tz{height:0;overflow:visible;position:relative;flex-shrink:0}
/* Resizer pill pinned just above p1 hand */
#hand-resizer{position:absolute;bottom:var(--hand-h);left:0;right:var(--panel-w);height:6px;background:transparent;cursor:ns-resize;z-index:20}
/* Hand pinned to bottom edge — DEPRECATED id, kept for safety */
/* ── Right play space ── */
#right-panel{position:fixed;top:0;right:0;width:var(--panel-w);height:100vh;background:#07101E;border-left:1px solid var(--bdr);z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 0;overflow:hidden;pointer-events:auto}
/* Dice rows at top/bottom of play space */
/* ── Dice Hand zones (top/bottom of play space) ── */
.ps-hand-zone{width:100%;display:flex;align-items:center;gap:6px;padding:5px 10px;flex-shrink:0;border:1px solid var(--bdrhi);border-left:none;border-right:none;background:#07101E;position:relative}
.ps-hand-lbl{font-size:7px;font-weight:700;letter-spacing:1.5px;color:var(--txtd);white-space:nowrap;flex-shrink:0}
.ps-dicerow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;flex:1;min-width:0}
.ps-all-btn{font-size:8px;font-weight:700;padding:3px 8px;border-radius:4px;border:1.5px solid var(--bdrhi);background:transparent;color:var(--txtd);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:color .1s,border-color .1s}
.ps-all-btn:hover{border-color:var(--teal);color:var(--teal)}
/* Center area: tray + controls */
.ps-center{display:flex;flex-direction:row;gap:12px;align-items:center;justify-content:center;flex:1;min-height:0;width:100%;overflow:hidden;padding:8px}
/* Shared dice tray */
.ps-tray{
  flex-shrink:0;
  background:#0A1828;border:2px dashed var(--bdrhi);border-radius:12px;
  position:relative;overflow:hidden;
}
#shared-tray{width:285px;height:285px}
.ps-tray.drag-over{border-color:var(--teal);background:#0C1E32}
.ps-tray.drag-blocked{border-color:#C02828;background:#1A0808}
.ps-tray-lbl{position:absolute;bottom:5px;right:10px;font-size:7px;font-weight:700;letter-spacing:1px;color:var(--txtd);pointer-events:none;opacity:.5}
/* Tray controls column */
.ps-tray-controls{display:flex;flex-direction:column;gap:6px;align-items:center;flex-shrink:0}
.ps-roll-btn{padding:8px 14px;border-radius:6px;border:1.5px solid var(--teal);background:#00C4A015;color:var(--teal);font-size:11px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:background .12s;white-space:nowrap}
.ps-roll-btn:hover{background:#00C4A030}
.ps-roll-btn:disabled{border-color:var(--bdr);color:var(--txtd);background:transparent;cursor:not-allowed}
.ps-recall-btn{padding:5px 8px;border-radius:5px;border:1.5px solid var(--bdrhi);background:transparent;color:var(--txtd);font-size:8px;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:border-color .12s,color .12s;white-space:nowrap}
.ps-recall-btn:hover:not(:disabled){border-color:var(--teal);color:var(--teal)}
.ps-recall-btn:disabled{opacity:.35;cursor:not-allowed}
.ps-reset-btn{padding:5px 8px;border-radius:5px;border:1.5px solid var(--bdrhi);background:transparent;color:var(--txtd);font-size:8px;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:border-color .12s,color .12s}
.ps-reset-btn:hover:not(:disabled){border-color:#C06030;color:#C06030}
.ps-reset-btn:disabled{opacity:.35;cursor:not-allowed}
/* Die in play space */
.ps-die{width:52px;height:52px;border-radius:7px;border:2px solid;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0;background:var(--panel);user-select:none}
.ps-die.in-tray{position:absolute;cursor:pointer}
.ps-die.dg{cursor:grabbing;opacity:.7}
.ps-die .dv{position:absolute;top:3px;right:4px;font-size:9px;font-weight:700}
/* Vertical resizer — sits at the left edge of the right panel */
#panel-resizer{position:fixed;top:0;right:var(--panel-w);width:6px;height:100vh;background:transparent;cursor:ew-resize;z-index:30}
#panel-resizer-pill{position:absolute;top:50%;left:1px;width:4px;height:32px;transform:translateY(-50%);background:var(--bdrhi);border-radius:3px;pointer-events:none;transition:background .15s}
/* Copy buttons — small inline utility */
.copy-btn{font-size:7px;font-weight:700;letter-spacing:.5px;padding:2px 6px;border-radius:3px;border:1px solid var(--bdrhi);background:transparent;color:var(--txtd);cursor:pointer;transition:color .1s,border-color .1s;white-space:nowrap}
.copy-btn:hover{color:var(--teal);border-color:var(--teal)}
.copy-btn.copied{color:var(--teal);border-color:var(--teal)}

/* ── Overlay: fullscreen, above everything, pointer-events off by default ── */
#overlay{position:fixed;inset:0;z-index:500;pointer-events:none}
.ov-tok{position:absolute;pointer-events:auto;cursor:grab;user-select:none}
.ov-tok.dg{cursor:grabbing}

/* ── Snap highlight on ability cells ── */
.ac.snap-target{border-color:var(--teal)!important;filter:brightness(1.5)!important;box-shadow:0 0 14px #00C4A050!important}
.ac.snap-discard{border-color:#C02828!important;filter:brightness(1.4)!important}

/* ── Ability grid ── */
.agrid{
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  grid-template-rows:minmax(0,1fr) minmax(0,1fr);
  gap:4px;height:100%;padding:4px;background:#060810;
}
/* Sub-ability module — a full separate card in row 2 of its column */
.ac-sub-card{
  background:#0A1020;border:1px solid var(--bdr);border-top:2px dashed;
  border-radius:8px;padding:6px 10px 5px;
  display:flex;flex-direction:column;gap:4px;align-items:center;
  overflow:hidden;min-height:0;
}
.ac-sub-name{font-size:11px;font-weight:700;line-height:1.2;text-align:center}

.ac{
  background:#0E1526;border:1px solid var(--bdr);border-top:3px solid;
  border-radius:8px;padding:8px 10px 6px;
  display:flex;flex-direction:column;gap:4px;align-items:center;
  transition:filter .12s,border-color .15s;cursor:default;overflow:hidden;min-height:0;
}
.ac:hover{filter:brightness(1.25)}
.ac.drop-ok{border-color:var(--teal)!important;filter:brightness(1.6)!important;box-shadow:0 0 12px #00C4A040}
.ac.upgraded{border-top-color:var(--gold)!important}
.ac.snap-target{border-color:var(--teal)!important;filter:brightness(1.5)!important;box-shadow:0 0 14px #00C4A050!important}
@keyframes upgradeFlash{0%{filter:brightness(3)}100%{filter:brightness(1.3)}}
.ac.flash{animation:upgradeFlash .5s ease-out}
.ac.available{filter:brightness(1.35);box-shadow:0 0 10px var(--avail-color,#ffffff18);background:#111E32}

/* Title: fixed size, never auto-scaled */
.an{font-size:13px;font-weight:700;line-height:1.2;text-align:center;flex-shrink:0}
/* Req icons row */
.areq{display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:wrap;flex-shrink:0}
.areq-txt{font-size:9px;color:var(--gold);line-height:1;font-weight:600}
.abadge{font-size:7px;font-weight:700;padding:1px 5px;border-radius:3px;white-space:nowrap;align-self:center;flex-shrink:0}
/* fx: auto-scaled to fill remaining top-half space */
.af{font-size:10px;color:#7A8FA8;line-height:1.4;overflow:hidden;margin-top:2px;padding-top:4px;border-top:1px solid var(--bdr);text-align:center;width:100%}
.af .die-ico{display:inline-flex;vertical-align:middle;line-height:0;margin:0 1px}
/* Pull Card button — arrow icon inline with ability name */
.pull-btn{font-size:10px;line-height:1;padding:1px 4px;border-radius:3px;border:1px solid var(--bdrhi);background:transparent;color:var(--txtd);cursor:pointer;transition:color .1s,border-color .1s;flex-shrink:0}
.pull-btn:hover{color:var(--gold);border-color:var(--gold)}
.dmg-blk{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;border:1.5px solid #6A7A8A;color:#9AABBC;font-weight:700;vertical-align:middle;line-height:1;flex-shrink:0}
.dmg-udf{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;border:1.5px solid #C02828;color:#E05050;font-weight:700;vertical-align:middle;line-height:1;flex-shrink:0}

.empty-grid{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;background:#060810}
.empty-grid-lbl{font-size:11px;color:var(--txtd);font-weight:700;letter-spacing:2px}
.char-picker{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.char-btn{border-radius:6px;border:1.5px solid var(--bdrhi);background:transparent;color:var(--txt);padding:5px 14px;font-size:10px;font-weight:700;letter-spacing:1px}
.char-btn:hover{border-color:var(--teal);color:var(--teal)}

/* ── Dice strip ── */
.dstrip{height:72px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--surf);border-bottom:1px solid var(--bdr);flex-shrink:0;overflow-x:auto}
#p1dstrip{border-bottom:none;border-top:1px solid var(--bdr)}
.die{width:52px;height:52px;border-radius:7px;border:2px solid;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0;transition:opacity .1s;background:var(--panel)}
.die.lk{opacity:.5;background:#070B14}
.dico{pointer-events:none}
.dv{position:absolute;top:3px;right:4px;font-size:9px;font-weight:700}
.sg{display:flex;flex-direction:column;align-items:center;gap:1px}
.slbl{font-size:7px;color:#CDD8E4;letter-spacing:2px;font-weight:800}
.svr{display:flex;align-items:center;gap:2px}
.sbtn{width:18px;height:18px;background:#060910;border:1px solid var(--bdr);border-radius:3px;color:var(--txtd);font-size:14px;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.sbtn:hover{color:var(--txt);border-color:var(--bdrhi)}
.sval{min-width:36px;text-align:center;font-size:22px;font-weight:700;cursor:text}
.sep{width:1px;height:44px;background:var(--bdr);flex-shrink:0}
.tok-cluster{display:flex;flex-direction:column;align-items:flex-start;gap:2px;flex-shrink:0}
.tok-cluster-lbl{font-size:6px;color:var(--txtd);font-weight:700;letter-spacing:1px}
.tok-row{display:flex;gap:2px;align-items:center}
.ftok{cursor:pointer;opacity:.28;transition:opacity .1s,filter .1s;flex-shrink:0;line-height:0;background:none;border:none;padding:0}
.ftok.on{opacity:1;filter:drop-shadow(0 0 4px #28A05070)}
.ftok:hover{opacity:.6}
.disc-pile{display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;flex-shrink:0}
.disc-inner{width:34px;height:48px;border-radius:4px;border:1px dashed #1C2538;background:#070C18;display:flex;align-items:center;justify-content:center;transition:border-color .12s,background .12s}
.disc-inner:hover{border-color:#283848}
.disc-inner.has{border-color:#2A3850;background:#0A1020}
.disc-inner.snap-over{border-color:#C02828!important;background:#200808!important}
.disc-lbl{font-size:6px;color:var(--txtd);font-weight:700;letter-spacing:.8px}
.disc-n{font-size:13px;font-weight:700;color:var(--txtd)}

/* Nevermore overlay token */
.nm-outer{display:flex;flex-direction:column;align-items:center;gap:2px}
.nmdbtn{background:#06090F;border:1px solid;border-radius:3px;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;width:16px;height:16px}

/* ── Hand strips ── */
:root{--hand-h:136px}
#p1hand,#p2hand{position:absolute;left:0;right:var(--panel-w);height:var(--hand-h);overflow-x:auto;overflow-y:visible;display:flex;align-items:flex-start;gap:8px;padding:5px 12px;border-top:1px solid var(--bdr);background:#08101C;z-index:10}
#p1hand{bottom:0;border-top:1px solid var(--bdr)}
#p2hand{top:46px;border-top:none;border-bottom:1px solid var(--bdr);align-items:flex-end}
#p1hand.snap-over,#p2hand.snap-over{background:#0A1828;outline:1px solid var(--teal)}
/* Flipped view — used when THIS browser is Player 2, so P2 always sits at the bottom */
.flip #center-block{flex-direction:column-reverse}
.flip #midsec{flex-direction:column-reverse}
.flip #right-panel{flex-direction:column-reverse}
.flip #p1hand{top:46px;bottom:auto;border-top:none;border-bottom:1px solid var(--bdr);align-items:flex-end}
.flip #p2hand{bottom:0;top:auto;border-bottom:none;border-top:1px solid var(--bdr);align-items:flex-start}
.hcard{width:116px;height:calc(var(--hand-h) - 10px);border-radius:6px;border:1.5px solid;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 5px 5px;position:relative;flex-shrink:0}
.hcn{font-size:9px;font-weight:700;text-align:center;line-height:1.35;pointer-events:none;width:100%}
.hcart{font-size:20px;line-height:1;pointer-events:none;text-align:center}
.hccp{font-size:11px;font-weight:700;padding:1px 7px;border-radius:3px;border:1px solid;pointer-events:none}

/* Card overlay token — physical card floating on board */
.card-ov{width:116px;height:calc(var(--hand-h) - 10px);border-radius:6px;border:1.5px solid;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 5px 5px;box-shadow:0 4px 20px #000000CC}
.card-ov-n{font-size:9px;font-weight:700;text-align:center;line-height:1.35;pointer-events:none;width:100%}
.card-ov-art{font-size:20px;line-height:1;pointer-events:none;text-align:center}
.card-ov-cp{font-size:11px;font-weight:700;padding:1px 7px;border-radius:3px;border:1px solid;pointer-events:none}

/* Leaflet viewer */
#leaflet-panel{display:none;position:fixed;inset:0;z-index:700;background:#000000BB;align-items:center;justify-content:center}
#leaflet-panel.open{display:flex}
#leaflet-box{position:relative;max-width:92vw;max-height:92vh;display:flex;flex-direction:column;gap:8px}
#leaflet-img{max-width:100%;max-height:86vh;border-radius:10px;box-shadow:0 8px 48px #000000EE;display:block}
#leaflet-close{position:absolute;top:-10px;right:-10px;background:#0C1828;border:1.5px solid var(--bdrhi);color:var(--txtd);border-radius:50%;width:28px;height:28px;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .12s,color .12s}
#leaflet-close:hover{border-color:var(--teal);color:var(--teal)}
/* Discard viewer panel */
#discard-panel{display:none;position:fixed;inset:0;z-index:600;background:#000000AA;align-items:center;justify-content:center}
#discard-panel.open{display:flex}
#discard-box{background:#0C1828;border:1.5px solid var(--bdrhi);border-radius:12px;padding:14px 16px;min-width:320px;max-width:80vw;max-height:80vh;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 40px #000000CC}
#discard-box-hdr{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#discard-box-title{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--txtd)}
#discard-box-close{background:transparent;border:1px solid var(--bdrhi);color:var(--txtd);border-radius:4px;font-size:11px;padding:2px 8px;cursor:pointer}
#discard-box-close:hover{border-color:var(--teal);color:var(--teal)}
#discard-cards{display:flex;flex-wrap:wrap;gap:8px;overflow-y:auto;padding-bottom:4px}

/* ── Multiplayer ── */
#net-panel{display:none;position:fixed;inset:0;z-index:800;background:#000000AA;align-items:center;justify-content:center}
#net-panel.open{display:flex}
#net-box{background:#0C1828;border:1.5px solid var(--bdrhi);border-radius:12px;padding:16px 18px;width:360px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 40px #000000CC}
.net-input{background:var(--surf);border:1px solid var(--bdrhi);border-radius:5px;color:var(--txtb);padding:7px 9px;font-size:11px;outline:none;font-family:inherit}
.net-input:focus{border-color:var(--teal)}
.hcard.cardback{background:#0A1424;border-color:#22304A;justify-content:center;gap:6px;cursor:default}
.cardback-ico{font-size:22px;opacity:.45;pointer-events:none}
.cardback-lbl{font-size:6px;color:var(--txtd);letter-spacing:2px;font-weight:700;pointer-events:none}

#gtt{display:none;position:fixed;z-index:9999;width:180px;background:var(--surf);border:1.5px solid;border-radius:9px;padding:10px 12px;pointer-events:none;box-shadow:0 4px 24px #000000CC}
.btn{border-radius:5px;border:1.5px solid var(--bdrhi);background:transparent;color:var(--txt);padding:4px 10px;font-size:10px;font-weight:700}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btnt{border-color:var(--teal);color:var(--teal);background:#00C4A015}
.btnt:disabled{border-color:var(--bdr);color:var(--txtd);background:transparent;cursor:not-allowed}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#283248;border-radius:3px}
</style>
</head>
<body>
<div id="app">
<div id="hdr">
  <div>
    <span style="font-size:16px;font-weight:700;color:var(--teal);letter-spacing:2px">DICE THRONE</span>
    <span style="font-size:9px;color:var(--txtd);margin-left:8px" id="hdr-sub">Season Two</span>
  </div>
  <div style="display:flex;gap:7px;align-items:center">
    <button class="btn" onclick="flipView()">Flip View &#8645;</button>
    <span id="net-hud" style="font-size:9px;font-weight:700;color:var(--txt);letter-spacing:.5px"></span>
    <button class="btn" onclick="openNetPanel()">Multiplayer</button>
    <button class="btn" onclick="resetGame()" style="color:var(--txtd)">New Game</button>
  </div>
</div>

<!-- P2 hand strip — sits just below header, above p2 ability grid -->
<div id="p2hand">
  <span id="p2handlbl" style="font-size:8px;color:var(--txtd);font-weight:700;white-space:nowrap;margin-top:4px;flex-shrink:0">HAND (P2)</span>
  <div id="p2handcards" style="display:flex;gap:8px;align-items:flex-start"></div>
</div>

<!-- Center block: p2 grid + dice strips + p1 grid. Fixed in the middle, never pushed by hand resize. -->
<div id="center-block">
<div id="p2sec"><div id="p2grid"></div></div>

<div id="midsec">
  <div class="dstrip" id="p2dstrip">
    <span style="font-size:9px;font-weight:700;color:var(--teal);letter-spacing:1px;flex-shrink:0">P2</span>
    <div class="sep"></div>
    <div class="sg"><span class="slbl">HP</span><div class="svr">
      <button class="sbtn" onclick="adjStat('p2','hp',-1)">&#8722;</button>
      <span class="sval" id="p2hp" style="color:var(--hp)" onclick="editStat(this,'p2','hp')">50</span>
      <button class="sbtn" onclick="adjStat('p2','hp',1)">+</button>
    </div></div>
    <div class="sg"><span class="slbl">CP</span><div class="svr">
      <button class="sbtn" onclick="adjStat('p2','cp',-1)">&#8722;</button>
      <span class="sval" id="p2cp" style="color:var(--gold)" onclick="editStat(this,'p2','cp')">2</span>
      <button class="sbtn" onclick="adjStat('p2','cp',1)">+</button>
    </div></div>
    <div class="sep"></div>
    <div id="p2tokens" style="display:flex;gap:6px;align-items:center;flex-shrink:0"></div>
    <div id="p2hex-spacer" style="width:0px;flex-shrink:0;transition:width .2s"></div>
    <div class="sep"></div>
    <button class="btn" id="p2draw" onclick="drawCard('p2')">Draw</button>
    <div class="disc-pile" id="p2disc-pile" onclick="viewDiscard('p2')" title="View discard pile">
      <div class="disc-inner" id="p2disc-vis"><span class="disc-n" id="p2disc-n">0</span></div>
      <span class="disc-lbl">DISCARD</span>
    </div>
    <span style="font-size:9px;color:#CDD8E4;font-weight:700" id="p2info">Hand:0</span>
    <button class="btn" id="p2leaflet-btn" style="display:none;margin-left:4px" onclick="openLeaflet('p2')">Leaflet</button>

  <div id="net-box">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:10px;font-weight:700;letter-spacing:2px;color:var(--txtd)">MULTIPLAYER</span>
      <button class="btn" onclick="closeNetPanel()">✕</button>
    </div>

    <input id="net-url" class="net-input" placeholder="https://dice-throne-relay.YOURNAME.workers.dev"/>
    <button class="btn btnt" style="padding:8px" onclick="netHost()">HOST A GAME</button>

      <input id="net-code" class="net-input" placeholder="CODE" maxlength="6" style="width:90px;text-transform:uppercase;letter-spacing:3px;text-align:center"/>

    </div>

    <button class="btn" id="net-leave" style="display:none" onclick="netDisconnect()">LEAVE GAME</button>
  </div>

<div id="overlay"></div>
<div id="gtt"></div>

<script>
const CS={
  blue:  {bg:"#081830",bdr:"#183870",lbl:"#3878CC",tag:"MAIN PHASE"},
  orange:{bg:"#221200",bdr:"#603010",lbl:"#C86010",tag:"ROLL PHASE"},
  red:   {bg:"#1E0808",bdr:"#501010",lbl:"#C02828",tag:"INSTANT"},
};

// ─── STATE ───────────────────────────────────────────────────────────────────
function initP(){
  return{hp:50,cp:2,dice:Array(5).fill(0).map((_,i)=>({v:1,inTray:false,_i:i})),rolls:3,hasRolled:false,
         deck:[],hand:[],discard:[],tokens:{},usedUpgrades:{}};
}
let S={view:"p1",turn:"p1",p1:initP(),p2:initP(),
       upgrades:{p1:{},p2:{}},chars:{p1:null,p2:null}};

// ─── CHARACTER LOADING ───────────────────────────────────────────────────────
const CHAR_ROSTER=[{id:"raveness",name:"Raveness",file:"raveness.js"}];

function loadCharacter(player,charId){
  const entry=CHAR_ROSTER.find(c=>c.id===charId);if(!entry)return;
  function activate(){
    const cd=window.DT_CHARACTERS&&window.DT_CHARACTERS[charId];if(!cd)return;
    applyCharacter(player,cd);
  }
  if(window.DT_CHARACTERS&&window.DT_CHARACTERS[charId]){activate();return;}
  const s=document.createElement("script");s.src=entry.file;s.onload=activate;
  s.onerror=()=>alert("Could not load "+entry.file);
  document.head.appendChild(s);
}

function applyCharacter(player,cd){
  S.chars[player]=cd;
  const shuf=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
  S[player].deck=shuf(cd.cards.map(c=>c.id));
  S[player].hand=[];S[player].discard=[];S[player].rolls=3;
  S[player].dice=Array(5).fill(0).map((_,i)=>({v:1,inTray:false,_i:i}));
  S[player].hasRolled=false;
  S[player].tokens=cd.initTokenState();
  S.upgrades[player]={};
  buildGrid(player+"grid",player);renderDice(player);renderTokens(player);
  renderHands();updateDrawBtn(player);
  const spacer=document.getElementById(player+"hex-spacer");
  if(spacer)spacer.style.width=cd.hasHexTokens?"80px":"0px";
  rebuildOverlay();
  autoSizeAbilCards();
  const lbtn=document.getElementById(player+"leaflet-btn");
  if(lbtn)lbtn.style.display=cd.leaflet?"":"none";
  const p1n=S.chars.p1?S.chars.p1.name:"",p2n=S.chars.p2?S.chars.p2.name:"";
  if(p1n&&p2n)document.getElementById("hdr-sub").textContent=p1n+" vs "+p2n;
  else if(p1n||p2n)document.getElementById("hdr-sub").textContent=(p1n||p2n)+" · Select P"+(p1n?"2":"1");
  // Multiplayer: apply any messages that were waiting for this character,
  // restore this browser's own saved game (after a refresh), or announce the pick.
  if(window.netFlush)window.netFlush(player);
  if(NET.restore&&player===NET.me){const r=NET.restore;NET.restore=null;applyLocalSave(r);}
  else{netSendChar(player);netSendTok(player);netSendCards(player);}
  // Backstop for slow (networked) loads: re-fit after layout has surely settled
  setTimeout(autoSizeAbilCards,150);
  setTimeout(autoSizeAbilCards,500);
}

// ─── OVERLAY ─────────────────────────────────────────────────────────────────
const OV_TOKENS={};

function rebuildOverlay(){
  Object.keys(OV_TOKENS).forEach(id=>{if(id.startsWith("nm_")||id.startsWith("hex_"))removeOverlayToken(id);});
  ["p1","p2"].forEach(p=>{
    const cd=S.chars[p];
    if(cd&&cd.buildOverlayTokens)cd.buildOverlayTokens(p,addOverlayToken,removeOverlayToken);
  });
}

function addOverlayToken(id,el,x,y){
  const ov=document.getElementById("overlay");
  if(OV_TOKENS[id]){OV_TOKENS[id].el.remove();delete OV_TOKENS[id];}
  el.id=id;el.classList.add("ov-tok");
  el.style.cssText+="left:"+x+"px;top:"+y+"px;position:absolute";
  ov.appendChild(el);
  OV_TOKENS[id]={el,x,y};
  el.addEventListener("mousedown",e=>{
    if(e.button!==0||e.target.tagName==="BUTTON")return;
    e.preventDefault();startOvDrag(e,id);
  });
}
function removeOverlayToken(id){if(OV_TOKENS[id]){OV_TOKENS[id].el.remove();delete OV_TOKENS[id];}}
window.addOverlayToken=addOverlayToken;
window.removeOverlayToken=removeOverlayToken;

// Nevermore dial — per player
const NM_DIALS={p1:0,p2:0};
function adjNM(player,d){
  NM_DIALS[player]=(NM_DIALS[player]+d+4)%4; // loops 0→1→2→3→0
  const el=document.getElementById("nm-dial-"+player);if(el)el.textContent=NM_DIALS[player];
  netSend({t:"nm",p:player,v:NM_DIALS[player]});
}

// ─── OVERLAY DRAG ────────────────────────────────────────────────────────────
const ovDrag={active:false,id:null,ox:0,oy:0,bx:0,by:0};
function startOvDrag(e,id){
  const t=OV_TOKENS[id];if(!t)return;
  ovDrag.active=true;ovDrag.id=id;
  ovDrag.ox=e.clientX;ovDrag.oy=e.clientY;ovDrag.bx=t.x;ovDrag.by=t.y;
  t.el.classList.add("dg");
}

// ─── CARD OVERLAY SYSTEM ─────────────────────────────────────────────────────
// Cards from hand become physical overlay tokens.
// On drop: snap to hand, discard, matching ability, or stay as played card on board.

const CARD_OV={};   // id -> {el, cid, player, x, y}
let cardDrag={active:false,id:null,ox:0,oy:0,bx:0,by:0,snapTarget:null};
let lastCardMoved=false;

function liftCardFromHand(player,cid,startX,startY){
  const char=S.chars[player];const c=char?char.cards.find(x=>x.id===cid):null;if(!c)return;
  const st=CS[c.t];
  const id="cov_"+player+"_"+cid.replace(/[^a-z0-9]/gi,"_");

  if(CARD_OV[id]){CARD_OV[id].el.remove();delete CARD_OV[id];}

  const el=document.createElement("div");
  el.className="card-ov ov-tok";
  el.style.cssText=`background:${st.bg};border-color:${st.bdr}`;
  el.innerHTML=`<span class="card-ov-n" style="color:${st.lbl}">${splitCardName(c.n)}</span><span class="card-ov-art">${c.e||"🃏"}</span><span class="card-ov-cp" style="color:${st.lbl};border-color:${st.bdr}">${c.cp}CP</span>`;
  el.dataset.cid=cid;el.dataset.player=player;

  const ov=document.getElementById("overlay");
  el.id=id;el.style.position="absolute";
  el.style.left=startX+"px";el.style.top=startY+"px";
  ov.appendChild(el);
  CARD_OV[id]={el,cid,player,x:startX,y:startY};

  // Remove from hand state
  S[player].hand=S[player].hand.filter(x=>x!==cid);
  renderHands();updateDrawBtn(player);

  // Start drag immediately
  cardDrag.active=true;cardDrag.id=id;cardDrag.snapTarget=null;
  cardDrag.ox=startX+60;cardDrag.oy=startY+50; // center of card
  cardDrag.bx=startX;cardDrag.by=startY;
  el.classList.add("dg");

  el.addEventListener("mousedown",e=>{
    if(e.button!==0)return;
    if(NET.on&&player!==NET.me)return; // opponent's card — hands off
    e.preventDefault();
    cardDrag.active=true;cardDrag.id=id;cardDrag.snapTarget=null;
    cardDrag.ox=e.clientX;cardDrag.oy=e.clientY;
    cardDrag.bx=CARD_OV[id].x;cardDrag.by=CARD_OV[id].y;
    el.classList.add("dg");
  });
}


// ─── TOOLTIP ─────────────────────────────────────────────────────────────────
function getSnapTarget(cid,player,mx,my){
  // 1. Check the player's own hand strip
  const hand=document.getElementById(player+"hand");
  if(hand){
    const hr=hand.getBoundingClientRect();
    if(mx>=hr.left&&mx<=hr.right&&my>=hr.top&&my<=hr.bottom)
      return{type:"hand",player};
  }

  // 2. Check own discard pile
  const disc=document.getElementById(player+"disc-vis");
  if(disc){
    const dr=disc.getBoundingClientRect();const pad=20;
    if(mx>=dr.left-pad&&mx<=dr.right+pad&&my>=dr.top-pad&&my<=dr.bottom+pad)
      return{type:"discard",player};
  }

  // 3. Check any ability cell (for upgrade drop detection)
  const char=S.chars[player];
  const cardUpgrades=char?char.cardUpgrades:{};
  const upgAbilId=cardUpgrades[cid];
  if(upgAbilId){
    const cell=document.querySelector("#"+player+"grid .ac[data-abilid='"+upgAbilId+"']");
    if(cell&&!S.upgrades[player][upgAbilId]){
      const cr=cell.getBoundingClientRect();
      if(mx>=cr.left&&mx<=cr.right&&my>=cr.top&&my<=cr.bottom)
        return{type:"upgrade",player,abilId:upgAbilId,cell};
    }
  }

  return null;
}

function clearSnapHighlights(){
  document.querySelectorAll(".ac.snap-target,.ac.drop-ok").forEach(el=>{
    el.classList.remove("snap-target","drop-ok");
  });
  document.querySelectorAll(".disc-inner.snap-over").forEach(el=>el.classList.remove("snap-over"));
  document.getElementById("p1hand").classList.remove("snap-over");
  document.getElementById("p2hand").classList.remove("snap-over");
}

function applySnapHighlight(snap){
  clearSnapHighlights();
  if(!snap)return;
  if(snap.type==="upgrade"&&snap.cell){
    snap.cell.classList.add("snap-target","drop-ok");
  }
  if(snap.type==="discard"){
    const dv=document.getElementById(snap.player+"disc-vis");
    if(dv)dv.classList.add("snap-over");
  }
  if(snap.type==="hand"){
    const hel=document.getElementById(snap.player+"hand");
    if(hel)hel.classList.add("snap-over");
  }
}

function commitCardDrop(id){
  const co=CARD_OV[id];if(!co)return;
  const{cid,player}=co;
  const snap=cardDrag.snapTarget;
  clearSnapHighlights();

  if(snap&&snap.type==="hand"){
    co.el.remove();delete CARD_OV[id];
    revertUpgradeByCard(player,cid);
    S[player].hand.push(cid);
    renderHands();updateDrawBtn(player);

  } else if(snap&&snap.type==="discard"){
    co.el.remove();delete CARD_OV[id];
    revertUpgradeByCard(player,cid);
    S[player].discard.push(cid);
    updateDiscardDisplay(player);

  } else if(snap&&snap.type==="upgrade"){
    applyUpgrade(player,cid,snap.abilId);
    co.el.classList.remove("dg");
    co.el.style.display="none"; // hidden but kept in CARD_OV so pullUpgradeCard can retrieve it

  } else {
    // Stay on board at full size
    co.el.classList.remove("dg");
  }
  netSendCards(player); // sync counts, discard, upgrades, and board cards
}

// ─── UNIFIED DRAG EVENTS ─────────────────────────────────────────────────────
window.addEventListener("mousemove",e=>{
  if(ovDrag.active){
    const dx=e.clientX-ovDrag.ox,dy=e.clientY-ovDrag.oy;
    const t=OV_TOKENS[ovDrag.id];
    if(t){t.x=ovDrag.bx+dx;t.y=ovDrag.by+dy;t.el.style.left=t.x+"px";t.el.style.top=t.y+"px";}
    return;
  }
  if(cardDrag.active){
    const co=CARD_OV[cardDrag.id];if(!co)return;
    const dx=e.clientX-cardDrag.ox,dy=e.clientY-cardDrag.oy;
    co.x=cardDrag.bx+dx;co.y=cardDrag.by+dy;
    co.el.style.left=co.x+"px";co.el.style.top=co.y+"px";
    // Check snap
    const snap=getSnapTarget(co.cid,co.player,e.clientX,e.clientY);
    if(JSON.stringify(snap)!==JSON.stringify(cardDrag.snapTarget)){
      cardDrag.snapTarget=snap;
      applySnapHighlight(snap);
    }
    return;
  }
},{passive:true});

window.addEventListener("mouseup",e=>{
  if(ovDrag.active){
    const tk=OV_TOKENS[ovDrag.id];
    if(tk){
      tk.el.classList.remove("dg");
      // Send position as a fraction of the window so it lands sensibly on
      // a differently-sized screen
      netSend({t:"ov",id:ovDrag.id,rx:tk.x/window.innerWidth,ry:tk.y/window.innerHeight});
    }
    ovDrag.active=false;ovDrag.id=null;return;
  }
  if(cardDrag.active){
    const id=cardDrag.id;
    cardDrag.active=false;cardDrag.id=null;
    commitCardDrop(id);
    setTimeout(()=>{lastCardMoved=false;},80);
    return;
  }
});

// Hand mousedown — lifts card onto overlay (attached to both hand strips)
function attachHandDrag(handEl){
  handEl.addEventListener("mousedown",e=>{
    if(e.button!==0)return;
    const card=e.target.closest(".hcard");
    if(!card||!card.dataset.cid)return;
    const cid=card.dataset.cid,player=card.dataset.player;
    e.preventDefault();e.stopPropagation();
    hideTooltip();hovCard=null;
    const r=card.getBoundingClientRect();
    liftCardFromHand(player,cid,r.left,r.top);
    cardDrag.ox=e.clientX;cardDrag.oy=e.clientY;
    cardDrag.bx=r.left+(e.clientX-(r.left+r.width/2));
    cardDrag.by=r.top+(e.clientY-(r.top+r.height/2));
  });
}
attachHandDrag(document.getElementById("p1hand"));
attachHandDrag(document.getElementById("p2hand"));

// ─── TOOLTIP ─────────────────────────────────────────────────────────────────
const gtt=document.getElementById("gtt");
let hovCard=null;
function showTooltip(player,cid,rect){
  const char=S.chars[player],c=char?char.cards.find(x=>x.id===cid):null;if(!c)return;
  const st=CS[c.t],isUpg=!!(char.cardUpgrades&&char.cardUpgrades[cid]);
  gtt.style.borderColor=st.bdr;
  gtt.innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:10px;color:${st.lbl};font-weight:700;line-height:1.3">${c.n}</span><span style="font-size:10px;color:${st.lbl};font-weight:700">${c.cp}CP</span></div><div style="font-size:7px;color:var(--txtd);background:${st.bg};border-radius:3px;padding:2px 5px;margin-bottom:7px;font-weight:700;letter-spacing:.5px">${st.tag}</div><div style="font-size:22px;text-align:center;margin-bottom:7px;line-height:1">${c.e||""}</div><p style="font-size:10.5px;color:var(--txt);margin:0;line-height:1.55">${c.x}</p>${isUpg?'<div style="font-size:8px;color:var(--teal);margin-top:7px;font-weight:700;border-top:1px solid var(--bdr);padding-top:5px">UPGRADE — drag onto matching ability</div>':""}`;
  gtt.style.display="block";
  const tw=180,th=gtt.offsetHeight||200;
  let left=rect.left+rect.width/2-tw/2;left=Math.max(8,Math.min(window.innerWidth-tw-8,left));
  gtt.style.width=tw+"px";gtt.style.left=left+"px";gtt.style.top=Math.max(8,rect.top-th-8)+"px";
}
function hideTooltip(){gtt.style.display="none";}
function attachHandTooltip(handEl){
  handEl.addEventListener("mouseover",e=>{
    if(cardDrag.active||ovDrag.active)return;
    const card=e.target.closest(".hcard");
    if(card&&card!==hovCard){hovCard=card;showTooltip(card.dataset.player,card.dataset.cid,card.getBoundingClientRect());}
  });
  handEl.addEventListener("mouseout",e=>{
    if(!e.relatedTarget?.closest(".hcard")){hovCard=null;hideTooltip();}
  });
}
attachHandTooltip(document.getElementById("p1hand"));
attachHandTooltip(document.getElementById("p2hand"));
// Tooltip for board cards (overlay)
document.getElementById("overlay").addEventListener("mouseover",e=>{
  if(cardDrag.active||ovDrag.active)return;
  const card=e.target.closest(".card-ov");
  if(card&&card.dataset.cid){
    const player=card.dataset.player||S.view;
    // For placed (scaled) cards, get the scaled rect and adjust to real position
    const r=card.getBoundingClientRect();
    showTooltip(player,card.dataset.cid,r);
  }
});
document.getElementById("overlay").addEventListener("mouseout",e=>{
  if(!e.relatedTarget?.closest(".card-ov")){hideTooltip();}
});

// ─── ABILITY GRID ────────────────────────────────────────────────────────────
function buildReqHTML(reqDef,char){
  if(!reqDef||!reqDef.length)return"";
  const parts=reqDef.map(r=>{
    if(r.type==="text")return`<span class="areq-txt">${r.label}</span>`;
    const faceIdx=char.faces.findIndex((f,i)=>i>0&&f.t===r.type.toUpperCase());
    let h="";for(let i=0;i<r.count;i++)h+=`<span style="display:inline-flex;line-height:0">${char.dieIcon(faceIdx,false,13)}</span>`;
    if(r.extra)h+=`<span class="areq-txt" style="margin-left:1px">${r.extra}</span>`;
    return h;
  });
  return parts.join("");
}
function renderFxHTML(fx,char){
  if(!char)return fx.replace(/\n/g,"<br>");
  const tIdx=char.faces.findIndex((f,i)=>i>0&&f.t==="TALON");
  const fIdx=char.faces.findIndex((f,i)=>i>0&&f.t==="FEATHER");
  const eIdx=char.faces.findIndex((f,i)=>i>0&&f.t==="EYE");
  const ico=(idx)=>`<span class="die-ico">${char.dieIcon(idx,false,11)}</span>`;
  const blk=(n)=>`<span class="dmg-blk">${n}</span>`;
  const udf=(n)=>`<span class="dmg-udf">${n}</span>`;
  return fx
    .replace(/\{T\}/g,ico(tIdx))
    .replace(/\{F\}/g,ico(fIdx))
    .replace(/\{E\}/g,ico(eIdx))
    .replace(/(\d+) Blockable/g,(_,n)=>blk(n))
    .replace(/(\d+) Undefendable/g,(_,n)=>udf(n))
    .replace(/\n/g,"<br>");
}
function buildAbilCard(a,ab,upgraded,char,col,row,rowSpan){

function buildGrid(containerId,player){
  const char=S.chars[player],el=document.getElementById(containerId);
  if(!char){buildEmptyGrid(containerId,player);return;}
  char._player=player;
  el.className="agrid";
  const upgrades=S.upgrades[player];

  // Column assignment:
  // Cols 1-6: first 6 offensive abilities
  // Col 7: nothing (def) row 1, ult row 2
  // Col 8: 7th offensive ability row 1, its sub (if any) row 2; or empty
  // Actually layout: abilities in order, def+ult share col 8
  // Order from ABIL: peck(off) fowl(off) murder(off) sight(off) craven(off) beguile(off) chamber(off) nothing(def) ult(ult)
  // We want: cols 1-7 = the 7 off abilities, col 8 top = def, col 8 bottom = ult
  // Sub-abilities of upgraded off abilities go in row 2 of their column

  let html="";
  let offCol=0;

  char.abilities.forEach(a=>{
    const ab=upgrades[a.id]||a;
    const upgraded=!!upgrades[a.id];

    if(ab.t==="def"){
      html+=buildAbilCard(a,ab,upgraded,char,8,1,1);
      return;
    }
    if(ab.t==="ult"){
      html+=buildAbilCard(a,ab,upgraded,char,8,2,1);
      return;
    }

    // Offensive ability
    offCol++;
    const col=offCol;
    const hasSub=!!(ab.sub);
    // Main card spans row 1 only (sub gets row 2); if no sub, span both rows
    const rowSpan=hasSub?1:2;
    html+=buildAbilCard(a,ab,upgraded,char,col,1,rowSpan);
    if(hasSub){
      html+=buildSubCard(ab.sub,char,col);
    }
  });

  el.innerHTML=html;
}

// Scale .af (effect text) to fill all available card space below the fixed header.
// Uses scrollHeight to detect true content size even when overflow:hidden clips it.
function autoSizeAbilCards(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll(".ac,.ac-sub-card").forEach(card=>{
      const cardH=card.offsetHeight;
      if(!cardH)return;
      const fx=card.querySelector(".af");
      if(!fx)return;

      // Measure all sibling elements (name, req, badge) that sit above the fx block
      let fixedH=0;
      Array.from(card.children).forEach(child=>{
        if(child===fx)return;
        fixedH+=child.offsetHeight;
      });
      // Card vertical padding (~14px) + gaps between children
      fixedH+=14+(card.children.length-1)*4;

      const fxTarget=Math.max(12,cardH-fixedH-3); // small buffer prevents last-line clipping

      // Binary search: use scrollHeight so overflow:hidden doesn't hide overflowing content
      let lo=8,hi=22;
      for(let i=0;i<11;i++){
        const mid=((lo+hi)/2)|0;
        fx.style.fontSize=mid+"px";
        fx.querySelectorAll("svg").forEach(s=>{
          const sz=Math.max(8,mid-1);s.setAttribute("width",sz);s.setAttribute("height",sz);
        });
        if(fx.scrollHeight<=fxTarget)lo=mid+1; else hi=mid-1;
      }
      const final=Math.max(8,lo-1);
      fx.style.fontSize=final+"px";
      fx.querySelectorAll("svg").forEach(s=>{
        const sz=Math.max(8,final-1);s.setAttribute("width",sz);s.setAttribute("height",sz);
      });
    });
  }));
}

// ─── DICE ────────────────────────────────────────────────────────────────────
const d6=()=>Math.floor(Math.random()*6)+1;
const DIE_SIZE=52;
const TRAY_PAD=16; // extra edge padding so rotated corners stay inside border
const TRAY_SIZE=285;
// A die rotated 45° has diagonal = 52*√2 ≈ 73.5px. Two such dice need their
// top-left corners at least 74px apart on both axes to never touch pixel-to-pixel.
const CLEARANCE=76; // center-to-center min distance, covers worst-case rotation
// Max top-left position: tray inner edge minus die size minus edge pad
const TRAY_MAX=TRAY_SIZE-DIE_SIZE-TRAY_PAD;

function diceOverlap(ax,ay,bx,by){
  // Use centers + circular clearance — covers all rotation angles
  const acx=ax+DIE_SIZE/2, acy=ay+DIE_SIZE/2;
  const bcx=bx+DIE_SIZE/2, bcy=by+DIE_SIZE/2;
  const dx=acx-bcx, dy=acy-bcy;
  return Math.sqrt(dx*dx+dy*dy)<CLEARANCE;
}

// All tray dice across both players
function allTrayDice(){
  const result=[];
  ["p1","p2"].forEach(p=>{
    if(S.chars[p])S[p].dice.filter(d=>d.inTray).forEach(d=>result.push({player:p,die:d}));
  });
  return result;
}

// Which player currently owns the tray (has dice in it), or null if empty
function trayOwner(){
  for(const p of["p1","p2"]){
    if(S.chars[p]&&S[p].dice.some(d=>d.inTray))return p;
  }
  return null;
}

// Find a non-overlapping position scanning top-left to bottom-right
// excludeIdx: skip this die index for the given player when checking occupied
function findTrayPos(player,excludeIdx){
  const occupied=allTrayDice()
    .filter(e=>!(e.player===player&&e.die._i===excludeIdx))
    .map(e=>({x:e.die.tx||TRAY_PAD,y:e.die.ty||TRAY_PAD}));
  for(let y=TRAY_PAD;y<=TRAY_MAX;y+=4){
    for(let x=TRAY_PAD;x<=TRAY_MAX;x+=4){
      if(occupied.every(o=>!diceOverlap(x,y,o.x,o.y)))return{x,y};
    }
  }
  return{x:TRAY_PAD,y:TRAY_PAD};
}

function renderDice(player){

// Send all hand dice to tray (blocks if opponent has dice in tray)
function sendAllToTray(player){
  if(NET.on&&player!==NET.me)return;
  const opponent=player==="p1"?"p2":"p1";
  if(S[opponent].dice.some(d=>d.inTray)){
    const tray=document.getElementById("shared-tray");
    tray.classList.add("drag-blocked");
    setTimeout(()=>tray.classList.remove("drag-blocked"),600);
    return;
  }
  S[player].dice.filter(d=>!d.inTray).forEach(d=>{
    const pos=findTrayPos(player,d._i);
    d.inTray=true;d.tx=pos.x;d.ty=pos.y;d.angle=0;
  });
  renderDice(player);
}

// Roll: randomize v, angle, and position for all of a player's tray dice.
// Uses rejection sampling with circular clearance to guarantee no pixel overlap.
function rollTray(player){
  const P=S[player];if(!S.chars[player])return;
  P.hasRolled=true;

  // Collect positions already locked by OTHER player's tray dice
  const opponent=player==="p1"?"p2":"p1";
  const fixed=S[opponent].dice.filter(d=>d.inTray).map(d=>({x:d.tx||TRAY_PAD,y:d.ty||TRAY_PAD}));

  // Place each of this player's tray dice one at a time
  const placed=[...fixed]; // starts with opponent's occupied spots
  P.dice.filter(d=>d.inTray).forEach(d=>{
    d.v=d6();
    d.angle=Math.floor(Math.random()*360);
    let tries=0,px=TRAY_PAD,py=TRAY_PAD,ok=false;
    while(!ok&&tries<2000){
      px=TRAY_PAD+Math.floor(Math.random()*(TRAY_MAX-TRAY_PAD));
      py=TRAY_PAD+Math.floor(Math.random()*(TRAY_MAX-TRAY_PAD));
      ok=placed.every(p=>!diceOverlap(px,py,p.x,p.y));
      tries++;
    }
    if(!ok){
      // Exhaustive fallback: scan grid for first clear spot
      outer:for(let gy=TRAY_PAD;gy<=TRAY_MAX;gy+=4){
        for(let gx=TRAY_PAD;gx<=TRAY_MAX;gx+=4){
          if(placed.every(p=>!diceOverlap(gx,gy,p.x,p.y))){px=gx;py=gy;ok=true;break outer;}
        }
      }
    }
    d.tx=px;d.ty=py;
    placed.push({x:px,y:py});
  });

  renderDice(player);
}

// Recall: move all of a player's tray dice back to their hand
function recallTray(player){
  S[player].dice.forEach(d=>{d.inTray=false;d.tx=undefined;d.ty=undefined;d.angle=0;});
  renderDice(player);
}

// Reset: move all of a player's tray dice to hand and reset faces to 1
function resetTray(player){
  S[player].hasRolled=false;
  S[player].dice.forEach(d=>{d.v=1;d.inTray=false;d.tx=undefined;d.ty=undefined;d.angle=0;});
  renderDice(player);
}

function cycleVal(p,i){S[p].dice[i].v=(S[p].dice[i].v%6)+1;renderDice(p);}

// Send a hand die to the tray (click from hand)
function sendToTray(player,idx){
  const d=S[player].dice[idx];
  if(d.inTray)return;
  // Block if opponent has dice in tray
  const opponent=player==="p1"?"p2":"p1";
  if(S[opponent].dice.some(od=>od.inTray)){
    const tray=document.getElementById("shared-tray");
    tray.classList.add("drag-blocked");
    setTimeout(()=>tray.classList.remove("drag-blocked"),600);
    return;
  }
  const pos=findTrayPos(player,idx);
  d.inTray=true;d.tx=pos.x;d.ty=pos.y;d.angle=0;
  renderDice(player);
}

// Send a tray die back to the hand (click from tray)
function sendToHand(player,idx){
  const d=S[player].dice[idx];
  if(!d.inTray)return;
  d.inTray=false;d.tx=undefined;d.ty=undefined;d.angle=0;
  renderDice(player);
}

// ─── PLAY SPACE DIE DRAG & CLICK ─────────────────────────────────────────────
const dieDrag={active:false,player:null,idx:null,fromTray:false,el:null,ghost:null,startX:0,startY:0,moved:false};

function initDieDrag(){
  const ps=document.getElementById("right-panel");

  ps.addEventListener("mousedown",e=>{
    if(e.button!==0)return;
    const die=e.target.closest(".ps-die");
    if(!die||!die.dataset.p)return;
    if(NET.on&&die.dataset.p!==NET.me)return; // opponent's die
    e.preventDefault();
    const player=die.dataset.p,idx=+die.dataset.i;
    const d=S[player].dice[idx];
    dieDrag.active=true;dieDrag.player=player;dieDrag.idx=idx;
    dieDrag.fromTray=d.inTray;dieDrag.el=die;
    dieDrag.startX=e.clientX;dieDrag.startY=e.clientY;dieDrag.moved=false;

    const r=die.getBoundingClientRect();
    const ghost=document.createElement("div");
    ghost.style.cssText=`position:fixed;pointer-events:none;z-index:9000;opacity:.85;width:52px;height:52px;border:2px solid ${die.style.borderColor};background:#0F1828;border-radius:7px;display:flex;align-items:center;justify-content:center;left:${r.left}px;top:${r.top}px;box-shadow:${die.style.boxShadow}`;
    ghost.innerHTML=die.innerHTML;
    document.body.appendChild(ghost);
    dieDrag.ghost=ghost;
    die.style.opacity="0.25";
  });

  window.addEventListener("mousemove",e=>{
    if(!dieDrag.active||!dieDrag.ghost)return;
    const dx=e.clientX-dieDrag.startX,dy=e.clientY-dieDrag.startY;
    if(Math.abs(dx)>4||Math.abs(dy)>4)dieDrag.moved=true;
    dieDrag.ghost.style.left=(e.clientX-26)+"px";
    dieDrag.ghost.style.top=(e.clientY-26)+"px";
    const tray=document.getElementById("shared-tray");
    if(tray&&!dieDrag.fromTray){
      const tr=tray.getBoundingClientRect();
      const over=e.clientX>=tr.left&&e.clientX<=tr.right&&e.clientY>=tr.top&&e.clientY<=tr.bottom;
      // Check if blocked by opponent
      const opponent=dieDrag.player==="p1"?"p2":"p1";
      const blocked=over&&S[opponent].dice.some(d=>d.inTray);
      tray.classList.toggle("drag-over",over&&!blocked);
      tray.classList.toggle("drag-blocked",blocked);
    }
  },{passive:true});

  window.addEventListener("mouseup",e=>{
    if(!dieDrag.active)return;
    const{player,idx,fromTray,ghost,el,moved}=dieDrag;
    if(ghost)ghost.remove();
    if(el)el.style.opacity="";
    const tray=document.getElementById("shared-tray");
    if(tray){tray.classList.remove("drag-over");tray.classList.remove("drag-blocked");}

    if(!moved){
      if(fromTray)sendToHand(player,idx);
      else sendToTray(player,idx);
    } else {
      if(tray){
        const tr=tray.getBoundingClientRect();
        const overTray=e.clientX>=tr.left&&e.clientX<=tr.right&&e.clientY>=tr.top&&e.clientY<=tr.bottom;
        const opponent=player==="p1"?"p2":"p1";
        const blocked=S[opponent].dice.some(d=>d.inTray);

        if(overTray&&!fromTray&&!blocked){
          const d=S[player].dice[idx];
          let tx=Math.max(TRAY_PAD,Math.min(TRAY_MAX,e.clientX-tr.left-DIE_SIZE/2));
          let ty=Math.max(TRAY_PAD,Math.min(TRAY_MAX,e.clientY-tr.top-DIE_SIZE/2));
          const occupied=allTrayDice().filter(en=>!(en.player===player&&en.die._i===idx)).map(en=>({x:en.die.tx||TRAY_PAD,y:en.die.ty||TRAY_PAD}));
          // Scan for first clear position from drop point
          outer2:for(let gy=TRAY_PAD;gy<=TRAY_MAX;gy+=4){
            for(let gx=TRAY_PAD;gx<=TRAY_MAX;gx+=4){
              if(occupied.every(o=>!diceOverlap(gx,gy,o.x,o.y))){
                // Pick nearest to drop point
                if(!occupied.some(o=>diceOverlap(tx,ty,o.x,o.y))){break outer2;}
                tx=gx;ty=gy;break outer2;
              }
            }
          }
          d.inTray=true;d.tx=tx;d.ty=ty;d.angle=0;
        } else if(!overTray&&fromTray){
          S[player].dice[idx].inTray=false;
        }
      }
      renderDice(player);
    }

    dieDrag.active=false;dieDrag.player=null;dieDrag.idx=null;dieDrag.el=null;dieDrag.ghost=null;dieDrag.moved=false;
  });
}

// ─── ABILITY AVAILABILITY HIGHLIGHT ─────────────────────────────────────────
// After a real roll, count the dice face types and check each ability's
// requirements. Qualifying abilities get a soft glow; non-qualifying ones clear it.
function updateAvailableAbils(player){
  const P=S[player],char=S.chars[player];
  const cells=document.querySelectorAll("#"+player+"grid .ac");
  // Always clear first
  cells.forEach(c=>{c.classList.remove("available");c.style.removeProperty("--avail-color");});
  if(!char||!P.hasRolled)return;

  // Count how many of each face type are showing across all dice
  const counts={talon:0,feather:0,eye:0};
  P.dice.forEach(d=>{
    const f=char.faces[d.v];
    if(f)counts[f.t.toLowerCase()]=(counts[f.t.toLowerCase()]||0)+1;
  });

  // Check the straight combos: small straight = 1-2-3-4-5 or 2-3-4-5-6 in values
  const vals=P.dice.map(d=>d.v).sort((a,b)=>a-b);
  const vStr=vals.join("");
  const isSmallStraight=["12345","23456"].includes(vStr)||
    vStr.replace(/(.)\1+/g,"$1").length>=4&&(vStr.includes("1234")||vStr.includes("2345")||vStr.includes("3456")||vStr.includes("4567")||vStr.includes("5678"));
  // Simpler: check for 4 consecutive values anywhere in the sorted set
  const uniq=[...new Set(vals)];
  let straight4=false,straight5=false;
  for(let i=0;i<=uniq.length-4;i++){
    if(uniq[i+3]-uniq[i]===3&&uniq[i+1]-uniq[i]===1&&uniq[i+2]-uniq[i+1]===1&&uniq[i+3]-uniq[i+2]===1){
      straight4=true;
      if(i<=uniq.length-5&&uniq[i+4]-uniq[i+3]===1)straight5=true;
    }
  }
  if(uniq.length===5&&uniq[4]-uniq[0]===4)straight5=true;

  cells.forEach(cell=>{
    const abilId=cell.dataset.abilid;
    if(!abilId)return;
    const upgrades=S.upgrades[player];
    const ab=upgrades[abilId]||(char.abilities.find(a=>a.id===abilId));
    if(!ab)return;

    // Defense never auto-qualifies (it uses its own roll phase)
    if(ab.t==="def")return;

    // Ultimate: requires all 5 dice showing the eye face (value 6 for Raveness)
    if(ab.t==="ult"){
      const allEyes=P.dice.every(d=>{const f=char.faces[d.v];return f&&f.t==="EYE";});
      if(allEyes){
        cell.classList.add("available");
        cell.style.setProperty("--avail-color",ab.c+"40");
      }
      return;
    }

    const qualified=ab.req.every(r=>{
      if(r.type==="text"){
        const lbl=(r.label||"").toLowerCase();
        if(lbl.includes("small straight"))return straight4;
        if(lbl.includes("large straight"))return straight5;

      return (counts[r.type]||0)>=r.count;
    });

      cell.classList.add("available");

    }
  });
}

function byId(player,cid){const char=S.chars[player];return char?char.cards.find(c=>c.id===cid)||null:null;}

// Split a card name into 1 or 2 lines, balancing length as evenly as possible.
// Single-word names stay on one line. Multi-word names find the split point
// that minimises the difference in character count between the two halves.
function splitCardName(name){
  // Strip trailing punctuation like "!" for measurement, restore after
  const words=name.split(" ");
  if(words.length===1)return name;
  let best=0,bestDiff=Infinity;
  for(let i=1;i<words.length;i++){
    const top=words.slice(0,i).join(" ").length;
    const bot=words.slice(i).join(" ").length;
    const diff=Math.abs(top-bot);
    if(diff<bestDiff){bestDiff=diff;best=i;}
  }
  return words.slice(0,best).join(" ")+"<br>"+words.slice(best).join(" ");
}

  Object.keys(S.upgrades[player]).forEach(abilId=>{

function pullUpgradeCard(player,abilId){
  if(NET.on&&player!==NET.me)return;
  const upg=S.upgrades[player]&&S.upgrades[player][abilId];
  if(!upg)return;
  const cardId=upg._cardId;

  // Find the ability cell to anchor the card's landing position
  const cell=document.querySelector("#"+player+"grid .ac[data-abilid='"+abilId+"']");
  let spawnX=window.innerWidth/2-58, spawnY=window.innerHeight/2-63;
  if(cell){
    const r=cell.getBoundingClientRect();
    spawnX=r.left;spawnY=r.top;
  }

  // Revert the upgrade state and rebuild the grid
  delete S.upgrades[player][abilId];
  buildGrid(player+"grid",player);
  autoSizeAbilCards();
  updateAvailableAbils(player);

  // Find the hidden overlay card and restore it
  const ovId="cov_"+player+"_"+cardId.replace(/[^a-z0-9]/gi,"_");
  const co=CARD_OV[ovId];
  if(co){
    co.el.style.display="";
    co.x=spawnX;co.y=spawnY;
    co.el.style.left=spawnX+"px";co.el.style.top=spawnY+"px";
  } else {
    // Overlay card was lost (e.g. the page was refreshed) — rebuild it
    makeBoardCard(player,cardId,ovId,spawnX,spawnY,true);
  }
  netSendCards(player);
}

// Re-fit ability text whenever the grid areas actually change size. This makes
// sizing independent of WHEN the character script finishes loading — the moment
// the grid reaches its real height (even late, over a slow connection), the text
// refits itself. Font changes don't alter the watched outer size, so no loop.
let _abilRO=null;
function observeAbilSizing(){
  if(_abilRO||typeof ResizeObserver==="undefined")return;
  let scheduled=false;
  _abilRO=new ResizeObserver(()=>{
    if(scheduled)return;scheduled=true;
    requestAnimationFrame(()=>{scheduled=false;autoSizeAbilCards();});
  });
  ["p1sec","p2sec"].forEach(id=>{const el=document.getElementById(id);if(el)_abilRO.observe(el);});
}

// ─── MULTIPLAYER ─────────────────────────────────────────────────────────────
// Two browsers connect to a small Cloudflare Worker "relay" (a message
// forwarder in the cloud). Each browser owns ONE player slot — host is P1,
// joiner is P2 — and only broadcasts changes for the things it owns.
// Hand contents are never sent: the opponent only ever sees a card count.

const RELAY_URL="https://dice-throne-relay.danny61734.workers.dev"; // your deployed relay

var NET={on:false,me:null,ws:null,room:null,applying:false,restore:null,
         pending:{p1:[],p2:[]},retry:null,wantOpen:false,seen:false};

// Character files (raveness.js etc.) call these:
function netCanEdit(player){return !NET.on||player===NET.me;}
window.netCanEdit=netCanEdit;
window.netTokens=function(p){netSendTok(p);};
window.netFlush=function(p){ // apply messages that arrived before the character loaded
  const q=NET.pending[p];NET.pending[p]=[];
  q.forEach(d=>{NET.applying=true;try{netApply(d);}finally{NET.applying=false;}});
};

function pickCharacter(player,charId){
  if(NET.on&&player!==NET.me){
    alert("In multiplayer, only "+player.toUpperCase()+" can pick their own character.");
    return;
  }

// ── Sending ──────────────────────────────────────────────────────────────────
function netSend(obj){if(NET.on&&NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(obj));}
function netSendStat(p,stat){netSend({t:"stat",p:p,stat:stat,v:S[p][stat]});if(p===NET.me)netSaveLocal();}
function netSendDice(p){
  if(p!==NET.me)return;
  netSend({t:"dice",p:p,hr:!!S[p].hasRolled,
    dice:S[p].dice.map(d=>({v:d.v,inTray:!!d.inTray,tx:d.tx,ty:d.ty,angle:d.angle||0}))});
  netSaveLocal();
}
function netSendTok(p){if(p!==NET.me)return;netSend({t:"tok",p:p,tokens:S[p].tokens});netSaveLocal();}
function netBoardList(p){ // my visible cards on the board, positions as window fractions
  const out=[];
  Object.keys(CARD_OV).forEach(id=>{
    const co=CARD_OV[id];
    if(co.player===p&&co.el.style.display!=="none")
      out.push({id:id,cid:co.cid,rx:co.x/window.innerWidth,ry:co.y/window.innerHeight});
  });
  return out;
}
function netSendCards(p){
  if(p!==NET.me)return;
  const upg={};Object.keys(S.upgrades[p]).forEach(a=>{upg[a]=S.upgrades[p][a]._cardId;});
  netSend({t:"cards",p:p,hand:S[p].hand.length,deck:S[p].deck.length,
    discard:S[p].discard,upg:upg,board:netBoardList(p)});
  netSaveLocal();
}
function netSendChar(p){if(p!==NET.me)return;const c=S.chars[p];if(c)netSend({t:"char",p:p,c:c.id});}
function netSendAll(){ // full snapshot of everything this browser owns
  if(!NET.on)return;const me=NET.me;
  netSendChar(me);netSendDice(me);netSendTok(me);netSendCards(me);
  netSendStat(me,"hp");netSendStat(me,"cp");
  netSend({t:"nm",p:me,v:NM_DIALS[me]});
}

// ── Local save: lets a refreshed browser recover its own hidden hand ─────────
function netSaveLocal(){
  if(!NET.room||!NET.me)return;
  const me=NET.me,P=S[me];
  const upg={};Object.keys(S.upgrades[me]).forEach(a=>{upg[a]=S.upgrades[me][a]._cardId;});
  const data={charId:S.chars[me]?S.chars[me].id:null,hp:P.hp,cp:P.cp,hasRolled:!!P.hasRolled,
    dice:P.dice.map(d=>({v:d.v,inTray:!!d.inTray,tx:d.tx,ty:d.ty,angle:d.angle||0})),
    tokens:P.tokens,hand:P.hand,deck:P.deck,discard:P.discard,upg:upg,board:netBoardList(me)};
  try{localStorage.setItem("dt_save_"+NET.room+"_"+me,JSON.stringify(data));}catch(e){}
}
function netRestoreLocal(){
  let raw=null;try{raw=localStorage.getItem("dt_save_"+NET.room+"_"+NET.me);}catch(e){}
  if(!raw)return false;
  let d=null;try{d=JSON.parse(raw);}catch(e){return false;}
  if(!d||!d.charId)return false;
  if(S.chars[NET.me]&&S.chars[NET.me].id===d.charId){applyLocalSave(d);}
  else{NET.restore=d;loadCharacter(NET.me,d.charId);} // applied once the character finishes loading
  return true;
}
function applyLocalSave(d){
  const me=NET.me,P=S[me],char=S.chars[me];if(!char)return;
  P.hp=d.hp;P.cp=d.cp;P.hasRolled=!!d.hasRolled;
  const hpEl=document.getElementById(me+"hp");if(hpEl)hpEl.textContent=d.hp;
  const cpEl=document.getElementById(me+"cp");if(cpEl)cpEl.textContent=d.cp;
  d.dice.forEach((nd,i)=>{const od=P.dice[i];if(!od)return;od.v=nd.v;od.inTray=nd.inTray;od.tx=nd.tx;od.ty=nd.ty;od.angle=nd.angle;});
  if(d.tokens)P.tokens=d.tokens;
  P.hand=(d.hand||[]).slice();P.deck=(d.deck||[]).slice();P.discard=(d.discard||[]).slice();
  S.upgrades[me]={};
  Object.keys(d.upg||{}).forEach(a=>{if(char.upgrades[a])S.upgrades[me][a]={...char.upgrades[a],_cardId:d.upg[a]};});
  (d.board||[]).forEach(b=>makeBoardCard(me,b.cid,b.id,Math.round(b.rx*window.innerWidth),Math.round(b.ry*window.innerHeight),true));
  buildGrid(me+"grid",me);autoSizeAbilCards();
  renderDice(me);renderTokens(me);renderHands();updateDrawBtn(me);updateDiscardDisplay(me);updateAvailableAbils(me);
  const info=document.getElementById(me+"info");if(info)info.textContent="Hand:"+P.hand.length;
  netSendAll();
}

// ── Receiving ────────────────────────────────────────────────────────────────
function netReceive(raw){
  if(!NET.seen){NET.seen=true;updateNetHud();}
  let d=null;try{d=JSON.parse(raw);}catch(e){return;}
  NET.applying=true;
  try{netApply(d);}finally{NET.applying=false;}
}
function netApply(d){
  const me=NET.me;
  switch(d.t){
    case "stat":{
      S[d.p][d.stat]=d.v;
      const el=document.getElementById(d.p+d.stat);if(el)el.textContent=d.v;
      if(d.p===me)netSaveLocal();
      break;}
    case "char":{
      if(d.p===me)break; // my slot is restored locally, never from the network
      if(S.chars[d.p]&&S.chars[d.p].id===d.c)break;
      loadCharacter(d.p,d.c);
      break;}
    case "dice":{
      if(d.p===me)break;
      if(!S.chars[d.p]){NET.pending[d.p].push(d);break;} // character still loading
      d.dice.forEach((nd,i)=>{const od=S[d.p].dice[i];if(!od)return;od.v=nd.v;od.inTray=nd.inTray;od.tx=nd.tx;od.ty=nd.ty;od.angle=nd.angle;});
      S[d.p].hasRolled=!!d.hr;
      renderDice(d.p);
      break;}
    case "tok":{
      if(d.p===me)break;
      if(!S.chars[d.p]){NET.pending[d.p].push(d);break;}
      S[d.p].tokens=d.tokens;renderTokens(d.p);
      break;}
    case "cards":{
      if(d.p===me)break;
      if(!S.chars[d.p]){NET.pending[d.p].push(d);break;}
      applyRemoteCards(d);
      break;}
    case "turn":break; // turns are no longer tracked — screen stays static
    case "ov":{
      const tk=OV_TOKENS[d.id];
      if(tk){
        tk.x=Math.round(d.rx*window.innerWidth);tk.y=Math.round(d.ry*window.innerHeight);
        tk.el.style.left=tk.x+"px";tk.el.style.top=tk.y+"px";
      }
      break;}
    case "nm":{
      NM_DIALS[d.p]=d.v;
      const nel=document.getElementById("nm-dial-"+d.p);if(nel)nel.textContent=d.v;
      break;}
    case "reset":doResetGame();break;
  }
}
function applyRemoteCards(d){
  const p=d.p,char=S.chars[p];if(!char)return;
  S[p].handCount=d.hand;S[p].deckCount=d.deck;
  S[p].discard=(d.discard||[]).slice();updateDiscardDisplay(p);
  // Upgrades: add what's new, remove what's gone
  const want=d.upg||{};
  let gridDirty=false;
  Object.keys(S.upgrades[p]).forEach(a=>{if(!want[a]){delete S.upgrades[p][a];gridDirty=true;}});
  Object.keys(want).forEach(a=>{
    if(!S.upgrades[p][a]&&char.upgrades[a]){S.upgrades[p][a]={...char.upgrades[a],_cardId:want[a]};gridDirty=true;}
  });
  if(gridDirty){buildGrid(p+"grid",p);autoSizeAbilCards();updateAvailableAbils(p);}
  // Board cards: add / move / remove to match the owner's list
  const wantIds=new Set((d.board||[]).map(b=>b.id));
  Object.keys(CARD_OV).forEach(id=>{
    const co=CARD_OV[id];
    if(co.player===p&&!wantIds.has(id)){co.el.remove();delete CARD_OV[id];}
  });
  (d.board||[]).forEach(b=>{
    const x=Math.round(b.rx*window.innerWidth),y=Math.round(b.ry*window.innerHeight);
    if(CARD_OV[b.id]){
      const co=CARD_OV[b.id];co.x=x;co.y=y;
      co.el.style.left=x+"px";co.el.style.top=y+"px";co.el.style.display="";
    }else makeBoardCard(p,b.cid,b.id,x,y,false);
  });
  renderHands();updateDrawBtn(p);
  const info=document.getElementById(p+"info");if(info)info.textContent="Hand:"+d.hand;
}
// Build a face-up card on the board (used for opponent cards and for
// restoring my own cards after a refresh). withDrag=true attaches dragging.
function makeBoardCard(player,cid,id,x,y,withDrag){
  const char=S.chars[player];const c=char?char.cards.find(k=>k.id===cid):null;if(!c)return;
  const st=CS[c.t];
  if(CARD_OV[id]){CARD_OV[id].el.remove();delete CARD_OV[id];}
  const el=document.createElement("div");
  el.className="card-ov ov-tok";
  el.style.cssText="background:"+st.bg+";border-color:"+st.bdr+";position:absolute;left:"+x+"px;top:"+y+"px";
  el.innerHTML='<span class="card-ov-n" style="color:'+st.lbl+'">'+splitCardName(c.n)+'</span>'
    +'<span class="card-ov-art">'+(c.e||"🃏")+'</span>'
    +'<span class="card-ov-cp" style="color:'+st.lbl+';border-color:'+st.bdr+'">'+c.cp+'CP</span>';
  el.dataset.cid=cid;el.dataset.player=player;el.id=id;
  document.getElementById("overlay").appendChild(el);
  CARD_OV[id]={el:el,cid:cid,player:player,x:x,y:y};
  if(withDrag){
    el.addEventListener("mousedown",e=>{
      if(e.button!==0)return;
      if(NET.on&&player!==NET.me)return;
      e.preventDefault();
      cardDrag.active=true;cardDrag.id=id;cardDrag.snapTarget=null;
      cardDrag.ox=e.clientX;cardDrag.oy=e.clientY;
      cardDrag.bx=CARD_OV[id].x;cardDrag.by=CARD_OV[id].y;
      el.classList.add("dg");
    });
  }
}

// ── Connection ───────────────────────────────────────────────────────────────
function netHost(){
  const letters="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // no easily-confused characters
  let code="";for(let i=0;i<4;i++)code+=letters[Math.floor(Math.random()*letters.length)];
  netConnect(code,"p1");
}
function netJoin(){
  const code=(document.getElementById("net-code").value||"").trim().toUpperCase();
  if(code.length<3){netStatus("Type the room code the host gave you, then press JOIN.");return;}
  netConnect(code,"p2");
}
function netConnect(room,me){
  const u=document.getElementById("net-url");
  const base=((u&&u.value)||"").trim().replace(/\/+$/,"");
  if(!/^https?:\/\//.test(base)){netStatus("First paste your relay server URL above (it starts with https://).");return;}
  try{localStorage.setItem("dt_relay",base);}catch(e){}
  NET.wantOpen=false;clearTimeout(NET.retry);
  if(NET.ws){try{NET.ws.close();}catch(e){}}
  NET.room=room.toUpperCase();NET.me=me;NET.wantOpen=true;NET.seen=false;
  if(me==="p1")netStatus('You are hosting room <b style="color:var(--teal);font-size:16px;letter-spacing:4px">'+NET.room+'</b><br>Share this code with Player 2. Keep this tab open.');
  updateNetHud();
  netOpenSocket();
}
function netOpenSocket(){
  let base="";try{base=localStorage.getItem("dt_relay")||RELAY_URL||"";}catch(e){base=RELAY_URL||"";}
  base=base.replace(/\/+$/,"");
  if(!base||!NET.room)return;
  const wsUrl=base.replace(/^http/,"ws")+"/room/"+NET.room; // https:// becomes wss://
  try{NET.ws=new WebSocket(wsUrl);}catch(e){netStatus("That URL doesn't look right — check it and try again.");return;}
  if(NET.me==="p2")netStatus("Connecting…");
  NET.ws.onopen=function(){
    NET.on=true;updateNetHud();
    if(NET.me==="p2")netStatus("Connected to room "+NET.room+".");
    if(!netRestoreLocal())netSendAll();
    renderHands();updateDrawBtn("p1");updateDrawBtn("p2");
  };
  NET.ws.onmessage=function(ev){netReceive(ev.data);};
  NET.ws.onclose=function(){
    NET.on=false;updateNetHud();
    if(NET.wantOpen){clearTimeout(NET.retry);NET.retry=setTimeout(netOpenSocket,2000);}
  };
  NET.ws.onerror=function(){};
}
function netDisconnect(){
  NET.wantOpen=false;clearTimeout(NET.retry);
  if(NET.ws){try{NET.ws.close();}catch(e){}}
  NET.on=false;NET.me=null;NET.room=null;NET.seen=false;
  updateNetHud();netStatus("Left the game. Playing locally again.");
  renderHands();updateDrawBtn("p1");updateDrawBtn("p2");
}

// ── Panel + status readout ───────────────────────────────────────────────────
function applyFlip(){
  // When this browser plays P2, flip the whole board so P2 sits at the bottom
  const app=document.getElementById("app");
  if(app)app.classList.toggle("flip",NET.room!=null&&NET.me==="p2");
  autoSizeAbilCards();
}
function updateNetHud(){
  applyFlip();
  const hud=document.getElementById("net-hud");
  const leave=document.getElementById("net-leave");
  if(leave)leave.style.display=NET.room?"":"none";
  if(!hud)return;
  if(!NET.room){hud.textContent="";return;}
  const dot=NET.on?'<span style="color:#28A050">●</span>':'<span style="color:#C02828">●</span>';
  const opp=NET.seen?" · OPPONENT ✓":"";
  hud.innerHTML="ROOM "+NET.room+" · YOU ARE "+NET.me.toUpperCase()+opp+" "+dot;
}
function netStatus(msg){const el=document.getElementById("net-status");if(el)el.innerHTML=msg;}
function openNetPanel(){
  document.getElementById("net-panel").classList.add("open");
  const u=document.getElementById("net-url");
  if(u&&!u.value){let v="";try{v=localStorage.getItem("dt_relay")||"";}catch(e){}u.value=v||RELAY_URL||"";}
}
function closeNetPanel(){document.getElementById("net-panel").classList.remove("open");}
document.getElementById("net-panel").addEventListener("mousedown",function(e){
  if(e.target===document.getElementById("net-panel"))closeNetPanel();
});
</script>
